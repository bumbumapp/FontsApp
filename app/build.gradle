
apply plugin: 'com.android.application'
apply plugin:  'com.huawei.agconnect'
apply plugin:  'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'


android {
    namespace 'com.bumbumapps.stylishtext'
    compileSdk 36
    defaultConfig {
        applicationId "com.bumbumapps.styletext"
        minSdk 23
        targetSdk 36
        // Above the live AppGallery versionCode (4).
        versionCode 5
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // play = Google Play, hms = Huawei AppGallery (Huawei Ads / Petal, no Google Mobile Services).
    // Release uses the app's Petal slots (override with -PHMS_BANNER_ID=...); debug builds use Huawei's test slots.
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', (project.findProperty('HMS_BANNER_ID') ?: 'h01v53zw8u').toString()
            resValue 'string', 'hms_interstitial_id', (project.findProperty('HMS_INTERSTITIAL_ID') ?: 'm518s1rwxx').toString()
            resValue 'string', 'hms_test_banner_id', 'testw6vs28auh3'
            resValue 'string', 'hms_test_interstitial_id', 'testb4znbuh3n2'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        resValues true
    }
    lint {
        abortOnError false
    }
    sourceSets {
        main {
            assets {
                srcDirs 'src/main/assets', 'src/main/assets/'
            }
        }
    }
}

dependencies {
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
//    implementation 'com.google.firebase:firebase-analytics:19.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'androidx.core:core:1.17.0'
    implementation 'org.jetbrains:annotations:26.0.2'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.github.GrenderG:Toasty:1.4.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.material:material:1.13.0'
//    implementation 'com.google.android.gms:play-services-ads:20.2.0'
    implementation 'com.github.ismaeldivita:chip-navigation-bar:1.3.4'
    implementation 'com.google.code.gson:gson:2.13.2'
    // Play Core was split; the monolithic 1.10 crashes on Android 14 (receiver export flag).
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:app-update:2.1.0'
//    implementation 'com.onesignal:OneSignal:4.4.0'
    hmsImplementation 'com.huawei.agconnect:agconnect-core:1.9.6.300'

    implementation platform('com.google.firebase:firebase-bom:34.4.0')

    // Add the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-crashlytics'
}
